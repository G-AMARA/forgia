<div class="min-h-screen flex items-center justify-center bg-fantasy-black p-6">
  <div class="relative w-full max-w-md bg-stone-dark panel-carved border-2 border-gold rounded-xl p-8">
    <h2 class="font-display text-xl text-gold-bright mb-6">{{ localeService.t('reset_password_title') }}</h2>

    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-fantasy-moonstone">{{ localeService.t('password_label') }}</label>
        <input
          #passwordInput="ngModel"
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          required
          minlength="8"
          [pattern]="passwordPattern"
          autocomplete="new-password"
          [class.border-red-400]="password && passwordInput.invalid"
          [class.border-emerald-400]="password && passwordInput.valid"
          [class.border-gold/60]="!password"
          class="w-full px-3 py-2 rounded border bg-fantasy-black/40 text-fantasy-moonstone focus:outline-none focus:ring-2 focus:ring-gold-bright focus:border-gold-bright transition-colors"
        />
        @if (passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)) {
          <p class="text-xs text-red-300 mt-1">{{ localeService.t('password_pattern_hint') }}.</p>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-fantasy-moonstone">{{ localeService.t('repeat_password_label') }}</label>
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="repeatPassword"
          [(ngModel)]="repeat_password"
          required
          minlength="8"
          autocomplete="new-password"
          [class.border-red-400]="repeat_password && password && repeat_password !== password"
          [class.border-emerald-400]="repeat_password && password && repeat_password === password"
          [class.border-gold/60]="!repeat_password"
          class="w-full px-3 py-2 rounded border bg-fantasy-black/40 text-fantasy-moonstone focus:outline-none focus:ring-2 focus:ring-gold-bright focus:border-gold-bright transition-colors"
        />
      </div>

      <label class="flex items-center gap-1.5 text-xs text-fantasy-moonstone/80 cursor-pointer">
        <input type="checkbox" [(ngModel)]="showPassword" name="showPassword" class="accent-fantasy-gold" />
        {{ localeService.t('show_password_checkbox') }}
      </label>

      <button
        type="submit"
        [disabled]="!canSubmit()"
        class="mt-2 px-4 py-2.5 bg-fantasy-gold text-fantasy-black font-display tracking-wide rounded border-2 border-gold-bright hover:bg-fantasy-moonstone transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ localeService.t('reset_password_button') }}
      </button>
    </form>

    @if (errorMsg()) {
      <p class="text-sm text-red-300 mt-3 text-center">{{ errorMsg() }}</p>
    }
    @if (successMsg()) {
      <p class="text-sm text-green-300 mt-3 text-center">{{ successMsg() }}</p>
    }
  </div>
</div>
