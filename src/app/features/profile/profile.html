<section class="max-w-5xl space-y-6">
  @if (appNav.viewedProfileId(); as viewedId) {
    <div class="flex items-center justify-between gap-3">
      <h2 class="font-display text-2xl text-fantasy-gold">{{ localeService.t('profile_title') }}</h2>
      <button
        type="button" (click)="appNav.openProfile(null)"
        class="text-xs px-3 py-1.5 border border-gold/50 rounded hover:bg-gold hover:text-fantasy-black transition-colors"
      >
        {{ localeService.t('back_to_my_profile_button') }}
      </button>
    </div>

    <app-public-profile-card [userId]="viewedId" />
  } @else {
    <h2 class="font-display text-2xl text-fantasy-gold">{{ localeService.t('profile_title') }}</h2>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <app-profile-player-card />
      <app-profile-account-settings />
    </div>
  }
</section>
