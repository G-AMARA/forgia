@if (clones().length > 0) {
  <div class="mt-4 border-t border-gold/30 pt-3 space-y-2">
    <p class="text-xs uppercase tracking-wide text-slate-arcane">{{ localeService.t('forge_clones_title') }}</p>
    @for (clone of clones(); track clone.id) {
      <div class="flex items-center justify-between gap-2 text-sm bg-fantasy-black/40 border border-gold/30 rounded px-3 py-2">
        <span>
          {{ localeService.t('level_label') }} {{ clone.level }} · {{ clone.class_name }}
          @if (clone.campaign_name) {
            · {{ clone.campaign_name }}
          }
        </span>
        <button
          type="button"
          (click)="pull(clone.id, clone.campaign_name ?? null)"
          class="text-xs px-3 py-1 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors shrink-0"
        >
          {{ localeService.t('pull_from_campaign_button') }}
        </button>
      </div>
    }
  </div>
}
