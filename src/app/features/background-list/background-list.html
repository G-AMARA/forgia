<section class="border border-gold rounded-lg overflow-hidden">
    <button
      (click)="toggle.emit()"
      class="w-full flex items-center justify-between px-4 py-3 bg-parchment-dark font-display text-lg text-wine"
    >
      <span>{{ localeService.t('backgrounds_title') }} ({{ backgrounds().length }})</span>
      <span>{{ expanded ? '▾' : '▸' }}</span>
    </button>
  
    @if (expanded) {
      <div class="p-4">
        @if (backgrounds().length === 0) {
          <p class="text-slate-arcane italic">{{ localeService.t('loading') }}</p>
        } @else {
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            @for (bg of backgrounds(); track bg.id) {
              <div class="flex bg-white/60 border border-gold rounded-lg overflow-hidden">
                <div class="w-1.5 bg-gold shrink-0"></div>
                <div class="p-3 flex-1">
                  <h3 class="font-display text-base text-ink">{{ bg.name }}</h3>
                  <p class="text-xs text-slate-arcane mb-1">
                    {{ localeService.t('skill_proficiencies_label') }}: {{ skillNames(bg) }}
                  </p>
                  @if (featureDescription(bg)) {
                    <p class="text-xs italic opacity-80 line-clamp-2">{{ featureDescription(bg) }}</p>
                  }
                </div>
              </div>
            }
          </div>
        }
      </div>
    }
  </section>
