@if (rank(); as r) {
  <div class="relative flex items-center gap-2">
    <div class="hidden sm:flex flex-col leading-tight text-right">
      @if (!auth.isAdmin()) {
        <span class="text-[10px] uppercase text-slate-arcane">{{ navigationHours() }}h</span>
      }
      <span class="font-display text-xs text-fantasy-gold">{{ r.name }}</span>
    </div>
    <img [src]="r.icon" [alt]="r.name" [title]="r.name" class="w-8 h-8 rounded-full border-2 border-gold-bright" />

    @if (showLevelUp()) {
      <div class="absolute top-full mt-2 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-fantasy-gold text-fantasy-black text-xs font-display tracking-wide rounded-full shadow-lg glow-gold whitespace-nowrap z-30 animate-pulse">
        ⬆ Nuovo rango: {{ r.name }}!
      </div>
    }
  </div>
}
