@if (!campaignStore.current()) {
  <p class="text-slate-arcane italic">{{ localeService.t('no_active_campaign') }}</p>
} @else {
  <section class="space-y-6 max-w-4xl mx-auto">
    <div class="space-y-1">
      <button
        type="button" (click)="goToHub()"
        class="inline-flex items-center gap-1.5 text-sm text-slate-arcane hover:text-fantasy-gold transition-colors"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        {{ localeService.t('back_to_hub_button') }}
      </button>

      <h2 class="font-display text-2xl uppercase tracking-wide text-fantasy-moonstone">
        {{ localeService.t('edit_campaign_title') }} · <span class="text-fantasy-gold">{{ campaignStore.current()?.name }}</span>
      </h2>
    </div>

    <app-campaign-edit-form (saved)="goToHub()" (cancelled)="goToHub()"></app-campaign-edit-form>

    <div class="rounded-lg border border-red-900/50 bg-red-950/10 p-5 space-y-3">
      <h4 class="font-display text-sm text-red-300 uppercase tracking-wide">⚠ {{ localeService.t('danger_zone_title') }}</h4>
      <p class="text-xs text-slate-arcane">{{ localeService.t('danger_zone_delete_hint') }}</p>
      <button
        type="button" (click)="deleteCampaign()"
        class="text-sm px-4 py-2 border border-red-700 text-red-300 rounded hover:bg-red-900/70 hover:text-white transition-colors"
      >
        {{ localeService.t('delete_campaign_button') }}
      </button>
    </div>
  </section>
}
