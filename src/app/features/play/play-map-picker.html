<div class="space-y-2">
  @if (mapAlbumsStore.albums().length === 0) {
    <p class="text-slate-arcane italic text-sm">{{ localeService.t('map_albums_empty') }}</p>
  } @else {
    @for (album of mapAlbumsStore.albums(); track album.id) {
      <div>
        <button
          type="button"
          (click)="toggleAlbum(album.id)"
          class="w-full text-left px-3 py-2 text-sm border border-gold/50 rounded hover:bg-fantasy-black/80 hover:border-gold-bright transition-colors"
          [class.border-gold-bright]="expandedAlbum()?.id === album.id"
        >
          {{ album.name }}
        </button>

        @if (expandedAlbum()?.id === album.id) {
          <div class="grid grid-cols-3 gap-2 mt-2">
            @for (image of album.images; track image.id) {
              <img
                [src]="image.imageUrl" [alt]="image.caption ?? ''"
                (click)="choose(image)"
                class="h-16 w-full object-cover rounded border border-gold/50 cursor-pointer hover:border-gold-bright transition-colors"
                [class.border-gold-bright]="activeImage()?.id === image.id"
              />
            }
          </div>
        }
      </div>
    }
  }

  @if (activeImage()) {
    <button
      type="button"
      (click)="clear()"
      class="text-xs px-3 py-1 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors"
    >
      {{ localeService.t('play_clear_map_button') }}
    </button>
  }
</div>
