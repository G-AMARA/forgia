<!-- Solo icone sotto md: 3 pulsanti con etichetta sarebbero troppo larghi per stare a
     destra su un telefono in portrait senza invadere il pulsante del drawer a sinistra
     (vedi play.html, top-4 left-4). Da md: in su, etichette normali. -->
<div class="flex items-center gap-1 md:gap-2">
  <button
    type="button"
    (click)="toggle('reveal')"
    [class.bg-gold]="mode() === 'reveal'"
    [class.text-fantasy-black]="mode() === 'reveal'"
    class="text-sm p-2 md:px-3 md:py-1 bg-fantasy-black/80 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors"
  >
    🔆<span class="hidden md:inline"> {{ localeService.t('fog_reveal_button') }}</span>
  </button>
  <button
    type="button"
    (click)="toggle('cover')"
    [class.bg-gold]="mode() === 'cover'"
    [class.text-fantasy-black]="mode() === 'cover'"
    class="text-sm p-2 md:px-3 md:py-1 bg-fantasy-black/80 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors"
  >
    🌫️<span class="hidden md:inline"> {{ localeService.t('fog_cover_button') }}</span>
  </button>
  <button
    type="button"
    (click)="resetFog.emit()"
    class="text-sm p-2 md:px-3 md:py-1 bg-fantasy-black/80 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors"
  >
    ♻️<span class="hidden md:inline"> {{ localeService.t('fog_reset_button') }}</span>
  </button>
</div>
