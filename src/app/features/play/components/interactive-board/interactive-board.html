<!-- viewport: area visibile, fissa; il pan/zoom si applica solo al wrapper .board dentro
     (dimensioni naturali dell'immagine, spazio "mondo" dei token). Click qui = sfondo, deseleziona. -->
<div
  #viewportEl
  class="relative h-full w-full overflow-hidden select-none touch-none"
  [class]="viewport.cursorClass()"
  (wheel)="viewport.onWheel($event)"
  (pointerdown)="viewport.onPointerDown($event)"
  (click)="onBoardClick()"
>
  <div
    class="absolute top-0 left-0 origin-top-left"
    [style.width.px]="viewport.naturalSize().width"
    [style.height.px]="viewport.naturalSize().height"
    [style.transform]="'translate(' + viewport.transform().x + 'px, ' + viewport.transform().y + 'px) scale(' + viewport.transform().scale + ')'"
  >
    @if (image(); as img) {
      <img
        [src]="img.imageUrl"
        [alt]="img.caption ?? ''"
        (dragstart)="onImageDragStart($event)"
        class="absolute inset-0 w-full h-full object-cover pointer-events-none"
      />
    }

    @if (showGrid()) {
      <svg class="absolute inset-0 w-full h-full pointer-events-none">
        <defs>
          <pattern [id]="gridPatternId" [attr.width]="gridSize()" [attr.height]="gridSize()" patternUnits="userSpaceOnUse">
            <path
              [attr.d]="'M ' + gridSize() + ' 0 L 0 0 0 ' + gridSize()"
              fill="none"
              stroke="rgba(255,255,255,0.15)"
              stroke-width="1"
            />
          </pattern>
        </defs>
        <rect width="100%" height="100%" [attr.fill]="'url(#' + gridPatternId + ')'" />
      </svg>
    }

    @for (token of tokens(); track token.id) {
      @if (isMaster() || token.isVisible) {
        <app-board-token
          [token]="token"
          [position]="tokenPosition(token)"
          [size]="token.size * gridSize()"
          [borderClass]="tokenBorderClass(token)"
          [canDrag]="canDrag(token)"
          [isSelected]="token.id === selectedTokenId()"
          [dimmed]="isMaster() && !token.isVisible"
          (pointerDown)="onTokenPointerDown($event, token)"
          (contextMenu)="onTokenContextMenu($event, token)"
        />
      }
    }
  </div>

  <div class="absolute bottom-4 right-4 z-10 flex items-center gap-2">
    <button
      (click)="viewport.resetView()"
      [title]="localeService.t('play_reset_view')"
      class="text-sm px-3 py-1 bg-fantasy-black/80 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors"
    >
      ⤾ {{ localeService.t('play_reset_view') }}
    </button>
    <button
      (click)="viewport.toggleFullscreen()"
      [title]="localeService.t(viewport.isFullscreen() ? 'play_exit_fullscreen_button' : 'play_fullscreen_button')"
      class="w-9 h-9 flex items-center justify-center bg-fantasy-black/80 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors"
    >
      {{ viewport.isFullscreen() ? '🗗' : '⛶' }}
    </button>
  </div>

  <!-- D-Pad: solo sotto lg, solo con una pedina selezionata (tap, vedi dropToken). -->
  @if (selectedToken(); as token) {
    <app-token-dpad
      class="lg:hidden absolute bottom-4 left-4 z-20"
      (move)="moveSelectedToken($event.dx, $event.dy)"
      (confirm)="deselectToken()"
    />
  }

  @if (contextMenuToken(); as menu) {
    <app-token-context-menu
      [token]="menu.token"
      [isMaster]="isMaster()"
      [canRemove]="canRemoveToken(menu.token)"
      [position]="menu.position"
      (mutated)="tokensChanged.emit()"
      (closed)="contextMenuToken.set(null)"
      (inspectToken)="onInspectToken($event)"
    />
  }

  @if (inspectedToken(); as inspected) {
    <app-monster-card-modal [token]="inspected" (closed)="inspectedToken.set(null)" />
  }
</div>
