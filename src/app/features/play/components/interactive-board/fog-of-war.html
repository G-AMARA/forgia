<svg class="absolute inset-0 w-full h-full pointer-events-none">
  <defs>
    <mask [id]="maskId">
      <!-- Bianco = nebbia visibile ovunque di default; ogni operazione successiva è resa
           nell'ordine in cui è stata disegnata: nero per "scopri" (buca la nebbia), bianco
           per "copri" (la richiude) — l'ultima che tocca un punto vince. -->
      <rect width="100%" height="100%" fill="white" />
      @for (op of operations(); track $index) {
        <rect
          [attr.x]="op.rect.x"
          [attr.y]="op.rect.y"
          [attr.width]="op.rect.w"
          [attr.height]="op.rect.h"
          [attr.fill]="op.type === 'reveal' ? 'black' : 'white'"
        />
      }
    </mask>
  </defs>

  <rect width="100%" height="100%" [attr.fill]="fogColor()" [attr.mask]="'url(#' + maskId + ')'" />

  @if (isMaster() && drawingRect(); as r) {
    <rect
      [attr.x]="r.x"
      [attr.y]="r.y"
      [attr.width]="r.w"
      [attr.height]="r.h"
      fill="rgba(199,164,94,0.25)"
      stroke="rgb(199,164,94)"
      stroke-width="2"
    />
  }
</svg>
