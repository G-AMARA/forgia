<!-- A tutto schermo, fuori dall'app shell (niente header/navbar/footer, vedi app.html).
     Layout desktop-only per ora: la versione mobile (colonne impilate, scheda personaggio
     adattata via container query) si affronta in un passaggio successivo. -->
<div class="relative h-screen w-full overflow-hidden bg-fantasy-black">
  <!-- Mappa: sempre a tutto schermo, dimensione fissa indipendente dal pannello (il
       pannello ci sta sopra come overlay, non condivide lo spazio in un flex row: aprirlo/
       chiuderlo non deve mai restringere o allungare l'immagine). -->
  <app-play-map-panel class="absolute inset-0" [canManage]="isMaster()" [activeImage]="activeImage()" />

  @if (panelOpen()) {
    <div class="absolute inset-y-0 left-0 z-10 w-1/4 h-full overflow-y-auto border-r-2 border-gold bg-fantasy-black p-4 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between gap-2">
        <button
          (click)="goBackToHub()"
          class="text-sm px-3 py-1 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors"
        >
          ← {{ localeService.t('back_to_hub_button') }}
        </button>
        <button
          (click)="togglePanel()"
          [title]="localeService.t('play_collapse_panel')"
          class="text-sm px-2 py-1 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors"
        >
          ‹
        </button>
      </div>

      @if (isMaster()) {
        <app-play-master-panel
          [campaignId]="campaignId"
          [activeImage]="activeImage()"
          (selectImage)="activeImage.set($event)"
        />
      } @else {
        <app-play-character-panel />
      }
    </div>
  } @else {
    <button
      (click)="togglePanel()"
      [title]="localeService.t('play_expand_panel')"
      class="absolute top-4 left-4 z-10 text-sm px-2 py-1 bg-fantasy-black/80 border border-gold rounded hover:bg-gold hover:text-fantasy-black transition-colors"
    >
      ›
    </button>
  }
</div>
