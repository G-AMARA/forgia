<div class="space-y-3">
  <button
    type="button"
    (click)="toggleSection('npc')"
    class="w-full border border-gold/50 rounded-lg p-3 text-center hover:bg-fantasy-black/80 hover:border-gold-bright transition-colors"
    [class.border-gold-bright]="expandedSection() === 'npc'"
  >
    <p class="font-display text-sm text-fantasy-moonstone">🧑 {{ localeService.t('npc_title') }}</p>
  </button>
  @if (expandedSection() === 'npc') {
    <app-npc [campaignId]="campaignId()" (tokensChanged)="tokensChanged.emit()"></app-npc>
  }

  <button
    type="button"
    (click)="toggleSection('bestiary')"
    class="w-full border border-gold/50 rounded-lg p-3 text-center hover:bg-fantasy-black/80 hover:border-gold-bright transition-colors"
    [class.border-gold-bright]="expandedSection() === 'bestiary'"
  >
    <p class="font-display text-sm text-fantasy-moonstone">🐲 {{ localeService.t('bestiary_title') }}</p>
  </button>
  @if (expandedSection() === 'bestiary') {
    <app-bestiary [campaignId]="campaignId()" (tokensChanged)="tokensChanged.emit()"></app-bestiary>
  }

  <button
    type="button"
    (click)="toggleSection('maps')"
    class="w-full border border-gold/50 rounded-lg p-3 text-center hover:bg-fantasy-black/80 hover:border-gold-bright transition-colors"
    [class.border-gold-bright]="expandedSection() === 'maps'"
  >
    <p class="font-display text-sm text-fantasy-moonstone">🗺️ {{ localeService.t('maps_title') }}</p>
  </button>
  @if (expandedSection() === 'maps') {
    <app-play-map-picker
      [campaignId]="campaignId()"
      [activeImage]="activeImage()"
      (selectImage)="selectImage.emit($event)"
    />
  }
</div>
