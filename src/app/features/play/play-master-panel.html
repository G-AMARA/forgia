<div class="space-y-3">
  <button
    type="button"
    (click)="clearMonstersAndNpcs()"
    class="w-full text-sm px-3 py-2 bg-fantasy-black/80 text-fantasy-gold rounded border border-gold hover:bg-gold hover:text-fantasy-black transition-colors"
  >
    🧹 {{ localeService.t('play_clear_tokens_button') }}
  </button>

  <button
    type="button"
    (click)="toggleSection('npc')"
    class="compendium-tab w-full rounded-lg p-3 text-center transition-all"
    [class]="expandedSection() === 'npc' ? 'compendium-tab-active' : 'text-forge-text-sub hover:text-[#f0ebd8]'"
  >
    <p class="font-display text-sm">🧑 {{ localeService.t('npc_title') }}</p>
  </button>
  @if (expandedSection() === 'npc') {
    <app-npc [campaignId]="campaignId()" (tokensChanged)="tokensChanged.emit()"></app-npc>
  }

  <button
    type="button"
    (click)="toggleSection('bestiary')"
    class="compendium-tab w-full rounded-lg p-3 text-center transition-all"
    [class]="expandedSection() === 'bestiary' ? 'compendium-tab-active' : 'text-forge-text-sub hover:text-[#f0ebd8]'"
  >
    <p class="font-display text-sm">🐲 {{ localeService.t('bestiary_title') }}</p>
  </button>
  @if (expandedSection() === 'bestiary') {
    <app-bestiary [campaignId]="campaignId()" (tokensChanged)="tokensChanged.emit()"></app-bestiary>
  }

  <button
    type="button"
    (click)="toggleSection('maps')"
    class="compendium-tab w-full rounded-lg p-3 text-center transition-all"
    [class]="expandedSection() === 'maps' ? 'compendium-tab-active' : 'text-forge-text-sub hover:text-[#f0ebd8]'"
  >
    <p class="font-display text-sm">🗺️ {{ localeService.t('maps_title') }}</p>
  </button>
  @if (expandedSection() === 'maps') {
    <app-play-map-picker
      [campaignId]="campaignId()"
      [activeImage]="activeImage()"
      (selectImage)="selectImage.emit($event)"
    />
  }
</div>
