@if (modal.state(); as m) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-fantasy-black/70 backdrop-blur-sm"
    (click)="modal.dismiss()"
  >
    <div
      class="relative w-full max-w-sm bg-stone-textured panel-carved border-2 border-gold rounded-lg p-6 text-fantasy-moonstone"
      (click)="$event.stopPropagation()"
    >
      <h3
        class="font-display text-lg mb-3 flex items-center gap-2"
        [class.text-fantasy-gold]="m.kind === 'confirm'"
        [class.text-red-300]="m.kind === 'error'"
        [class.text-forest]="m.kind === 'success'"
      >
        @if (m.kind === 'error') {
          ⚠️
        } @else if (m.kind === 'success') {
          ✅
        } @else {
          ❓
        }
        {{ m.title }}
      </h3>

      <p class="text-sm mb-6 whitespace-pre-line">{{ m.message }}</p>

      <div class="flex justify-end gap-2">
        @if (m.kind === 'confirm') {
          <button
            type="button"
            (click)="modal.respond(false)"
            class="px-4 py-2 border-2 border-gold rounded font-display hover:bg-gold hover:text-fantasy-black transition-colors"
          >
            {{ m.cancelLabel ?? 'Annulla' }}
          </button>
          <button
            type="button"
            (click)="modal.respond(true)"
            class="px-4 py-2 bg-fantasy-gold text-fantasy-black font-display rounded border-2 border-gold hover:bg-fantasy-moonstone transition-colors"
          >
            {{ m.confirmLabel ?? 'Conferma' }}
          </button>
        } @else {
          <button
            type="button"
            (click)="modal.dismiss()"
            class="px-4 py-2 bg-fantasy-gold text-fantasy-black font-display rounded border-2 border-gold hover:bg-fantasy-moonstone transition-colors"
          >
            OK
          </button>
        }
      </div>
    </div>
  </div>
}
