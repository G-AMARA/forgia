@if (context.character(); as c) {
  <div class="border-t border-gold/20 pt-5">
    <h3 class="font-display text-lg text-fantasy-gold uppercase tracking-wide mb-3 text-center">{{ localeService.t('skills_label') }}</h3>
    <div class="grid grid-cols-1 sm:grid-cols-3 sm:gap-x-6">
      @for (column of skillColumns; track $index) {
        <div class="divide-y divide-gold/20">
          @for (skill of column; track skill.key) {
            <label class="flex items-center gap-3 py-2.5 cursor-pointer hover:bg-fantasy-black/30 transition-colors"
              [title]="privileges.isSkillLocked(skill.key) ? localeService.t('skill_locked_hint') : ''">
              <span class="relative flex items-center shrink-0">
                <input type="checkbox" class="peer appearance-none w-6 h-6 rounded-sm border-2 border-gold bg-fantasy-blue cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                  [checked]="combat.isSkillChecked(skill.key)" [disabled]="context.readOnly() || privileges.isSkillLocked(skill.key)"
                  (change)="combat.toggleSkill(skill.key)" />
                <svg class="pointer-events-none absolute inset-0 m-auto w-4 h-4 hidden peer-checked:block text-fantasy-gold" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 8.5l3 3 7-7" />
                </svg>
              </span>
              <span class="flex-1 min-w-0">
                <span class="block text-xs opacity-60">({{ localeService.t('ability_' + skill.ability) }}: {{ identity.abilityScores()[skill.ability] }})</span>
                <span class="block text-xs uppercase tracking-wider font-bold text-gold-glow [text-shadow:0_1px_3px_rgba(0,0,0,0.85)]">
                  {{ localeService.t('skill_' + skill.key) }}
                  @if (privileges.isSkillLocked(skill.key)) {
                    <span class="text-fantasy-gold/60 normal-case">({{ privileges.skillLockSourceLabel(skill.key) }})</span>
                  }
                </span>
              </span>
              <!-- Maestria (Expertise): raddoppia il bonus competenza, max 2 in tutta la scheda.
                   Bottone invece che dentro la label per non far scattare anche il checkbox
                   della competenza al click (stopPropagation di sicurezza). -->
              <button type="button" class="shrink-0 p-1 rounded transition-colors disabled:opacity-25 disabled:cursor-not-allowed"
                [disabled]="context.readOnly() || (!combat.isSkillMastered(skill.key) && (!combat.isSkillChecked(skill.key) || combat.skillMasteryLimitReached()))"
                [title]="localeService.t('skill_mastery_hint')"
                (click)="$event.stopPropagation(); $event.preventDefault(); combat.toggleSkillMastery(skill.key)">
                <svg viewBox="0 0 24 24" class="w-4 h-4" [attr.fill]="combat.isSkillMastered(skill.key) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"
                  [class.text-fantasy-gold]="combat.isSkillMastered(skill.key)" [class.glow-gold]="combat.isSkillMastered(skill.key)" [class.text-slate-arcane]="!combat.isSkillMastered(skill.key)">
                  <polygon points="12 2.5 14.9 9 22 9.6 16.6 14.3 18.2 21.2 12 17.4 5.8 21.2 7.4 14.3 2 9.6 9.1 9" />
                </svg>
              </button>
              <span class="shrink-0 px-3 py-1 rounded-full bg-fantasy-black/60 border border-gold/50 text-sm font-bold text-fantasy-gold">
                {{ formatModifier(combat.skillModifier(skill.ability, skill.key, c.level)) }}
              </span>
            </label>
          }
        </div>
      }
    </div>
  </div>
}
