<div class="flex flex-col gap-3" [class]="context.readOnly() ? '@4xl:col-span-2' : ''">
  @if (diary.pages().length === 0) {
    <p class="text-slate-arcane italic text-sm text-center py-6">{{ localeService.t('diary_empty_label') }}</p>
  } @else {
    <swiper-container init="true" navigation="true" style="--swiper-navigation-color: #c7a45e"
      class="block w-full aspect-671/942 @4xl:aspect-auto @4xl:w-[21.4rem] @4xl:h-120 mx-auto">
      @for (page of diary.pages(); track page.id) {
        <swiper-slide class="relative">
          @if (!context.readOnly()) {
            <button (click)="diary.startEdit(page)" [attr.aria-label]="localeService.t('edit_button')"
              class="absolute top-2 left-2 z-20 w-6 h-6 flex items-center justify-center rounded-full bg-fantasy-black/70 text-gold-glow hover:bg-fantasy-black transition-colors">
              <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </button>
            <button (click)="diary.deleteEntry(page.id)" [attr.aria-label]="localeService.t('remove_button')"
              class="absolute top-2 right-2 z-20 w-6 h-6 flex items-center justify-center rounded-full bg-fantasy-black/70 text-gold-glow hover:bg-fantasy-black transition-colors">
              <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                <line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" />
              </svg>
            </button>
          }
          <div class="absolute inset-0 bg-no-repeat bg-top bg-size-[100%_100%]" style="background-image: url('themes/TACCUINO2.png');">
            <div class="absolute top-[11%] bottom-[9%] left-[15%] right-[15%] flex flex-col gap-2">
              @if (page.title) {
                <p class="shrink-0 font-display text-sm font-bold text-black">{{ page.title }}</p>
              }
              <p class="shrink-0 font-display text-xs font-bold uppercase tracking-wide text-black/80">{{ page.dateLabel }}</p>
              <div class="flex-1 overflow-y-auto">
                <p class="font-body text-sm italic font-bold leading-relaxed text-black whitespace-pre-wrap">{{ page.content }}</p>
              </div>
            </div>
          </div>
        </swiper-slide>
      }
    </swiper-container>
  }
</div>
