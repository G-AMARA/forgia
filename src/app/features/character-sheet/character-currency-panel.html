<div>
  <h3 class="font-display text-lg text-fantasy-gold uppercase tracking-wide mb-3 text-center">{{ localeService.t('currency_title') }}</h3>
  <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
    <div class="frame-medieval relative rounded-sm p-3 flex flex-col items-center justify-center gap-1 overflow-hidden">
      <div class="absolute inset-0 bg-cover bg-center" [style.background-image]="'url(' + getCoinImagePath('copper') + ')'"></div>
      <div class="absolute inset-0 bg-fantasy-black/70"></div>
      <span class="relative text-[0.7rem] uppercase tracking-wider font-bold text-gold-glow whitespace-nowrap [text-shadow:0_1px_2px_rgba(0,0,0,0.95)]">{{ localeService.t('currency_copper_label') }}</span>
      <input type="number" min="0" [ngModel]="inventory.copper()" (ngModelChange)="inventory.copper.set($event)" [disabled]="context.readOnly()"
        class="relative w-full bg-transparent border-0 text-center text-2xl font-black text-gold-glow [text-shadow:0_2px_5px_rgba(0,0,0,0.9)] focus:outline-none disabled:opacity-90" />
    </div>
