@if (context.character()) {
  <!-- @container: le sotto-schede usano varianti @sm/@md/@lg (container query, non
       viewport) per adattarsi allo spazio reale disponibile — necessario perché la pagina
       "Gioca" monta questa scheda dentro una colonna stretta (1/4 schermo), dove i
       breakpoint sm:/md:/lg: normali di Tailwind (legati alla finestra, non al contenitore)
       continuerebbero a mostrare il layout desktop anche se lo spazio fisico è ridotto. -->
  <div class="rounded-lg p-4 @container bg-texture-stone">
    <section class="space-y-4">
      <app-character-sheet-header />

      <!-- Sotto-schede -->
      <div class="mt-6 flex items-center justify-between gap-2 border-b border-gold">
        <app-character-sheet-tabs [active]="activeSubTab()" [hasSpells]="!!context.character()?.class_name" (tabChange)="setSubTab($event)" />
        <app-character-sheet-save-button
          [visible]="!context.readOnly() && (activeSubTab() === 'general' || activeSubTab() === 'combat' || activeSubTab() === 'inventory')"
          (save)="saveActive()"
        />
      </div>

      @switch (activeSubTab()) {
        @case ('general') { <app-character-general-tab /> }
        @case ('combat') { <app-character-combat-tab /> }
        @case ('inventory') { <app-character-inventory-tab /> }
        @case ('spells') { <app-character-spells-tab /> }
        @case ('weapons') { <app-character-weapons-tab /> }
        @case ('diary') { <app-character-diary-tab /> }
      }
    </section>
  </div>
} @else {
  <p class="text-slate-arcane italic">{{ localeService.t('loading') }}</p>
}
