@if (context.character(); as c) {
  @if (c.spells.length === 0) {
    <p class="text-slate-arcane italic text-sm">{{ localeService.t('no_spells_known') }}</p>
  } @else {
    <div class="space-y-4">
      @for (group of spells.groupedCharacterSpells(); track group.level) {
        <div>
          <h4 class="font-display text-sm text-fantasy-gold mb-2">{{ group.label }} ({{ group.spells.length }})</h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            @for (spell of group.spells; track spell.rowId) {
              <app-character-spell-card [spell]="spell" />
            }
          </div>
        </div>
      }
    </div>
  }
}
