<section class="space-y-4">
  <h2 class="font-display text-2xl text-fantasy-gold">{{ localeService.t('manage_title') }}</h2>

  <div class="flex gap-1 border-b border-gold overflow-x-auto whitespace-nowrap">
    <button
      class="px-4 py-2 font-display text-sm border-b-4 transition-colors"
      [class.border-fantasy-gold]="activeSection() === 'races'"
      [class.border-transparent]="activeSection() !== 'races'"
      (click)="setSection('races')"
    >
      {{ localeService.t('tab_race_manage') }}
    </button>
    <button
      class="px-4 py-2 font-display text-sm border-b-4 transition-colors"
      [class.border-fantasy-gold]="activeSection() === 'subraces'"
      [class.border-transparent]="activeSection() !== 'subraces'"
      (click)="setSection('subraces')"
    >
      {{ localeService.t('tab_subrace_manage') }}
    </button>
    <button
      class="px-4 py-2 font-display text-sm border-b-4 transition-colors"
      [class.border-fantasy-gold]="activeSection() === 'classes'"
      [class.border-transparent]="activeSection() !== 'classes'"
      (click)="setSection('classes')"
    >
      {{ localeService.t('tab_class_manage') }}
    </button>
    <button
      class="px-4 py-2 font-display text-sm border-b-4 transition-colors"
      [class.border-fantasy-gold]="activeSection() === 'subclasses'"
      [class.border-transparent]="activeSection() !== 'subclasses'"
      (click)="setSection('subclasses')"
    >
      {{ localeService.t('tab_subclass_manage') }}
    </button>
    <button
      class="px-4 py-2 font-display text-sm border-b-4 transition-colors"
      [class.border-fantasy-gold]="activeSection() === 'backgrounds'"
      [class.border-transparent]="activeSection() !== 'backgrounds'"
      (click)="setSection('backgrounds')"
    >
      {{ localeService.t('tab_background_manage') }}
    </button>
    <button
      class="px-4 py-2 font-display text-sm border-b-4 transition-colors"
      [class.border-fantasy-gold]="activeSection() === 'weapons'"
      [class.border-transparent]="activeSection() !== 'weapons'"
      (click)="setSection('weapons')"
    >
      {{ localeService.t('tab_weapon_manage') }}
    </button>
    <button
      class="px-4 py-2 font-display text-sm border-b-4 transition-colors"
      [class.border-fantasy-gold]="activeSection() === 'spells'"
      [class.border-transparent]="activeSection() !== 'spells'"
      (click)="setSection('spells')"
    >
      {{ localeService.t('tab_spell_manage') }}
    </button>
    <button
      class="px-4 py-2 font-display text-sm border-b-4 transition-colors"
      [class.border-fantasy-gold]="activeSection() === 'equipment'"
      [class.border-transparent]="activeSection() !== 'equipment'"
      (click)="setSection('equipment')"
    >
      {{ localeService.t('tab_equipment_manage') }}
    </button>
    <button
      class="px-4 py-2 font-display text-sm border-b-4 transition-colors"
      [class.border-fantasy-gold]="activeSection() === 'bestiary'"
      [class.border-transparent]="activeSection() !== 'bestiary'"
      (click)="setSection('bestiary')"
    >
      {{ localeService.t('tab_bestiary_manage') }}
    </button>
  </div>

  @switch (activeSection()) {
    @case ('races') { <app-race-create></app-race-create> }
    @case ('subraces') { <app-subrace-create></app-subrace-create> }
    @case ('classes') { <app-class-create></app-class-create> }
    @case ('subclasses') { <app-subclass-create></app-subclass-create> }
    @case ('backgrounds') { <app-background-create></app-background-create> }
    @case ('weapons') { <app-weapon-create></app-weapon-create> }
    @case ('spells') { <app-spell-create></app-spell-create> }
    @case ('equipment') { <app-equipment-create></app-equipment-create> }
    @case ('bestiary') { <app-bestiary-manage></app-bestiary-manage> }
  }
</section>
