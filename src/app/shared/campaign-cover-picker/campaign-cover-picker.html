<div class="flex flex-col gap-2">
  <div
    class="relative h-36 rounded-lg overflow-hidden border-2 border-gold bg-gradient-to-br"
    [class]="selectedCover().gradient"
  >
    <img [src]="getCoverImagePath(selectedCover())" [alt]="selectedCover().label" class="w-full h-full object-cover" />
    <div class="absolute inset-0 bg-gradient-to-t from-fantasy-black/80 via-transparent to-transparent"></div>
    <span class="absolute bottom-2 left-3 font-display text-sm text-fantasy-moonstone [text-shadow:0_2px_4px_rgba(0,0,0,0.9)]">
      {{ selectedCover().label }}
    </span>
  </div>

  <div class="flex flex-wrap gap-2">
    @for (cover of covers; track cover.key) {
      <button
        type="button" (click)="select(cover.key)" [title]="cover.label"
        class="w-12 h-12 rounded-lg overflow-hidden border-2 transition-all"
        [class.border-fantasy-gold]="coverKey() === cover.key"
        [class.glow-gold]="coverKey() === cover.key"
        [class.scale-105]="coverKey() === cover.key"
        [class.border-forge-border-soft]="coverKey() !== cover.key"
      >
        <img [src]="getCoverImagePath(cover)" [alt]="cover.label" class="w-full h-full object-cover" />
      </button>
    }
  </div>
</div>
