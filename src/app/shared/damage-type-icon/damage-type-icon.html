<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label() || null"
  [attr.aria-hidden]="label() ? null : true"
>
  @switch (type()?.toLowerCase()) {
    @case ('acid') {
      <path d="M12 3c-3.5 5-6 8.3-6 11.5a6 6 0 0012 0C18 11.3 15.5 8 12 3z" />
      <circle cx="12" cy="20.5" r="0.8" fill="currentColor" stroke="none" />
    }
    @case ('bludgeoning') {
      <circle cx="12" cy="7" r="3.2" />
      <path d="M12 10.2v10.3" />
      <path d="M9 20.5h6" />
    }
    @case ('cold') {
      <path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9" />
    }
    @case ('fire') {
      <path d="M12 21c-4 0-6.5-2.6-6.5-6C5.5 11 8 9 8 6c0-1.3-.4-2.5-.8-3.4 2.8.6 5.3 3 5.3 6.4 0 1.2-.3 2.1-.7 3 .8-.6 2-1.8 2-3.6 1.8 1.6 3.2 4 3.2 6.6 0 3.4-2.5 6-6 6z" />
    }
    @case ('force') {
      <path d="M12 3l6 9-6 9-6-9z" />
    }
    @case ('lightning') {
      <path d="M13 2 5 14h6l-2 8 9-13h-6l1-7z" fill="currentColor" stroke="none" />
    }
    @case ('necrotic') {
      <path d="M7 21V11a5 5 0 0110 0v10" />
      <path d="M4.5 21h15" />
      <path d="M12 8l-1.3 2.4 1.6 1.6-1.3 2" />
    }
    @case ('piercing') {
      <path d="M12 2v17M8 8l4-4 4 4" />
      <path d="M9 19h6" />
    }
    @case ('poison') {
      <path d="M10 3h4M11 3v5.5l-3.3 6A3 3 0 0010.4 19h3.2a3 3 0 002.7-4.5L13 8.5V3" />
      <circle cx="12" cy="15" r="0.8" fill="currentColor" stroke="none" />
    }
    @case ('psychic') {
      <path d="M2.5 12S6.7 6 12 6s9.5 6 9.5 6-4.2 6-9.5 6-9.5-6-9.5-6z" />
      <circle cx="12" cy="12" r="2.3" fill="currentColor" stroke="none" />
    }
    @case ('radiant') {
      <circle cx="12" cy="12" r="3.5" />
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" />
    }
    @case ('slashing') {
      <path d="M4 20 19 5" />
      <path d="M13 4h6v6" />
    }
    @case ('thunder') {
      <circle cx="6.5" cy="12" r="2.2" fill="currentColor" stroke="none" />
      <path d="M11 6.5a9 9 0 010 11" />
      <path d="M15 3a13.5 13.5 0 010 18" opacity="0.6" />
    }
    @default {
      <circle cx="12" cy="12" r="7" />
    }
  }
</svg>
