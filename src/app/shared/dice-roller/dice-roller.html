<!-- Sfondo Modale -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-fantasy-black/70 backdrop-blur-xl transition-opacity p-2 sm:p-4">
  
  <!-- Contenitore Principale Modale -->
  <div class="w-full max-w-6xl h-[90vh] lg:h-[80vh] bg-stone-900 border-2 border-stone-600 rounded-xl shadow-2xl flex flex-col lg:flex-row overflow-hidden">
    
    <!-- 1. BLOCCO COMANDI E RISERVA DADI -->
    <!-- order-2 su mobile (va in basso), lg:order-1 su desktop (torna a sinistra) -->
    <div class="w-full lg:w-1/4 bg-fantasy-black p-4 lg:p-6 flex flex-col border-t lg:border-t-0 lg:border-r border-stone-700 shrink-0 order-2 lg:order-1">
      <h2 class="text-lg lg:text-2xl font-bold text-fantasy-gold mb-3 lg:mb-6 text-center tracking-widest font-serif hidden lg:block">
        Riserva Dadi
      </h2>

      <!-- Griglia pulsanti dadi -->
      <div class="grid grid-cols-7 lg:grid-cols-4 gap-1.5 lg:gap-3 mb-3 lg:mb-4">
        <button *ngFor="let dice of availableDice" 
                (click)="addDiceToBoard(dice)"
                [disabled]="abilityMode"
                class="group relative flex aspect-square items-center justify-center p-1 lg:p-2 
                      bg-stone-800 hover:bg-stone-700 
                      border border-fantasy-gold/50 lg:border-2 hover:border-gold-bright 
                      text-amber-500 hover:text-amber-300
                      rounded-lg lg:rounded-xl transition-all shadow-md disabled:opacity-40 disabled:cursor-not-allowed"
                [style.background-image]="'url(/dice-icons/' + dice.type + '.svg)'"
                [style.background-size]="'50% 50%'"
                [style.background-position]="'center'"
                [style.background-repeat]="'no-repeat'"
                [attr.title]="abilityMode ? 'Modalità Caratteristica: 4d6 fissi' : ('Aggiungi un ' + dice.label)">
          
          <span class="absolute bottom-0.5 right-1 font-bold text-[9px] lg:text-[10px] font-serif text-stone-300">
            {{ dice.label }}
          </span>
        </button>
      </div>

      <!-- Azioni generali in basso -->
      <div class="flex flex-col gap-2 border-t border-stone-700 pt-3 lg:pt-4">
        
        <!-- Pulsante principale: a larghezza piena sia su mobile che su desktop -->
        <button (click)="trigger3DRoll()" 
          [disabled]="board.length === 0 || isRolling3D || (abilityMode && !canClose)"
          class="w-full py-2.5 lg:py-3 bg-fantasy-gold hover:bg-gold-bright text-fantasy-black text-sm lg:text-base uppercase tracking-wider rounded-lg shadow-lg disabled:opacity-50 transition-all hover:scale-[1.02] active:scale-95 z-20 disabled:cursor-not-allowed">
          @if (board.length === 0 && !abilityMode) {
            Seleziona Dadi
          } @else if (isRolling3D) {
            Lancio in corso...
          } @else {
            Tira i Dadi!
          }
        </button>
        
        <!-- Blocco inferiore: affiancato al 50% su mobile (flex), in colonna a larghezza piena su desktop (lg:flex-col) -->
        <div class="flex flex-row lg:flex-col gap-2 w-full items-center">
          
          <!-- Pulsante Svuota Plancia (o testo info in abilityMode) -->
          @if (!abilityMode) {
            <button (click)="clearBoard()" class="w-1/2 lg:w-full py-2 text-stone-400 hover:text-red-400 uppercase text-[10px] lg:text-xs font-bold tracking-wider bg-stone-900/60 hover:bg-stone-900 border border-stone-700 rounded-lg transition-all text-center">
              Svuota Plancia
            </button>
          } @else {
            <div class="w-1/2 lg:w-full text-[10px] lg:text-[11px] text-amber-400/80 text-center italic py-1 px-1 bg-stone-900/40 rounded-lg">
              4d6 (scarta peggiore)
            </div>
          }

          <!-- Pulsante Chiudi -->
          <button (click)="closeModal()" 
                  [disabled]="abilityMode || !canClose"
                  class="w-1/2 lg:w-full py-2 lg:py-2.5 px-4 bg-red-800 hover:bg-red-700 text-white rounded-lg font-bold text-xs lg:text-sm shadow-md disabled:opacity-40 disabled:cursor-not-allowed text-center">
            @if (!canClose) {
              Attendere...
            } @else {
              Chiudi
            }
          </button>
          
        </div>
      </div>
    </div>

    <!-- 2. BLOCCO PLANCIA 3D -->
    <!-- order-1 su mobile (va in alto), lg:order-2 su desktop (torna a destra) -->
    <div class="w-full lg:w-3/4 p-4 lg:p-6 relative flex flex-col bg-fantasy-black bg-[url('https://www.transparenttextures.com/patterns/dark-leather.png')] overflow-hidden flex-1 lg:flex-initial order-1 lg:order-2">
      
     <!-- Testata Plancia -->
      <div class="relative z-25 flex items-center justify-between w-full gap-2 mb-2 lg:mb-4">

        <!-- Area Chips Riepilogo (A sinistra / occupa lo spazio rimanente) -->
        <div class="flex-1 min-w-0"> 
          <div *ngIf="board.length > 0 && !isRolling3D" class="flex gap-1.5 flex-wrap overflow-x-auto py-1">
            <span *ngFor="let dice of board" class="px-2 py-0.5 bg-stone-800/90 text-fantasy-gold rounded-full border border-fantasy-gold/50 text-xs font-bold cursor-pointer hover:bg-red-900 hover:text-white shadow transition-all whitespace-nowrap" (click)="removeDice(dice.id)" title="Rimuovi">
              {{ dice.type }}
            </span>
          </div>
        </div>
        
        <!-- Totale e Pulsante X (Forzati sempre a DESTRA con shrink-0) -->
        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
          <!-- Totale dinamico -->
          <div class="bg-black/60 px-3 sm:px-4 py-1 rounded-full border border-stone-600 shadow-md flex items-center">
            <span class="text-stone-400 uppercase tracking-widest text-[9px] sm:text-[10px] mr-1.5">Totale:</span>
            <span class="text-lg sm:text-2xl font-bold text-fantasy-gold">{{ rollTotal }}</span>
          </div>

          <!-- Pulsante X di chiusura -->
          <button (click)="closeModal()" [disabled]="abilityMode || !canClose" class="p-1.5 text-stone-500 hover:text-red-500 hover:bg-black/40 rounded-full transition-all focus:outline-none disabled:opacity-30 disabled:cursor-not-allowed" title="Chiudi">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6 lg:w-7 lg:h-7">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

      </div>

      <!-- Area Tratteggiata di sfondo (Plancia 3D) -->
      <div class="relative z-0 flex-1 rounded-xl border-2 border-dashed border-stone-700/60 bg-black/30 shadow-inner p-2 flex items-center justify-center min-h-[140px] lg:min-h-0">
        @if(board.length === 0){
          <div class="text-center text-stone-500 italic text-sm lg:text-base pointer-events-none">
            Aggiungi dei dadi...
          </div>
        }
        <div id="dice-box-container" class="absolute inset-0 z-10 pointer-events-none"></div>
      </div>

    </div>

  </div>
</div>
