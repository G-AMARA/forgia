<div class="compendium-card p-4 space-y-4">
  <h4 class="font-display text-sm text-fantasy-gold uppercase tracking-wide">{{ localeService.t('campaign_settings_title') }}</h4>

  <div class="grid grid-cols-2 gap-3">
    <div class="flex flex-col gap-1">
      <label class="flex items-center gap-1.5 min-h-10 text-sm font-semibold text-forge-label">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
        {{ localeService.t('campaign_status_label') }}
      </label>
      <select [ngModel]="status()" (ngModelChange)="status.set($event)" name="status" class="px-3 py-2 rounded">
        @for (s of statuses; track s) {
          <option [value]="s">{{ localeService.t('campaign_status_' + s) }}</option>
        }
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="flex items-center gap-1.5 min-h-10 text-sm font-semibold text-forge-label">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
        </svg>
        {{ localeService.t('next_session_label') }}
      </label>
      <input
        type="datetime-local" name="nextSessionAt" class="px-3 py-2 rounded"
        [ngModel]="nextSessionAtLocal()" (ngModelChange)="nextSessionAtLocal.set($event)"
      />
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div class="flex flex-col gap-1">
      <label class="flex items-center gap-1.5 min-h-10 text-sm font-semibold text-forge-label">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
        </svg>
        {{ localeService.t('max_players_label') }}
      </label>
      <input
        type="number" min="1" name="maxPlayers" class="px-3 py-2 rounded"
        [ngModel]="maxPlayers()" (ngModelChange)="maxPlayers.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="flex items-center gap-1.5 min-h-10 text-sm font-semibold text-forge-label">
        <span class="shrink-0">🎲</span>
        {{ localeService.t('starting_level_label') }}
      </label>
      <input
        type="number" min="1" max="20" name="startingLevel" class="px-3 py-2 rounded"
        [ngModel]="startingLevel()" (ngModelChange)="startingLevel.set($event)"
      />
    </div>
  </div>

  @if (showGmSelector()) {
    <div class="flex flex-col gap-1 pt-2 border-t border-forge-border-panel">
      <label class="text-sm font-semibold text-forge-label">{{ localeService.t('master_label') }}</label>
      <select [ngModel]="ownerId()" (ngModelChange)="ownerId.set($event)" name="ownerId" class="px-3 py-2 rounded">
        @for (profile of gmOptions(); track profile.id) {
          <option [value]="profile.id">{{ profile.nickname ?? profile.id }}</option>
        }
      </select>
    </div>
  }

  <div class="flex items-center justify-between pt-2 border-t border-forge-border-panel">
    <span class="text-sm font-semibold text-forge-label">{{ localeService.t('campaign_public_label') }}</span>
    <button
      type="button" role="switch" [attr.aria-checked]="isPublic()" (click)="togglePublic()"
      class="relative w-11 h-6 rounded-full transition-colors shrink-0"
      [class.bg-fantasy-gold]="isPublic()" [class.bg-forge-iron]="!isPublic()"
    >
      <span
        class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform"
        [class.translate-x-5]="isPublic()"
      ></span>
    </button>
  </div>
</div>
